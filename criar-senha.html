<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar senha — Fera Fit</title>
  <meta name="description" content="Crie sua senha de acesso ao Fera Fit.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Biblioteca hospedada localmente (não via CDN de terceiro) — D010, 17/09/2026, achado da Segurança.
       Versão baixada: @supabase/supabase-js@2.116.0 (dist/umd/supabase.js). Para atualizar, baixar de novo
       de https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.X.X e substituir este arquivo. -->
  <script src="assets/js/supabase.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="marca" href="index.html">
        <img src="assets/img/logo.png" alt="Fera Fit">
        <span>Fera Fit</span>
      </a>
    </div>
  </header>

  <main>
    <section class="bloco">
      <div class="container">
        <div class="parceiro-box" style="max-width:420px;">

          <!-- ESTADO: verificando o link -->
          <div id="estado-carregando">
            <p style="color:var(--texto-secundario);text-align:center;margin:0;">Verificando seu link...</p>
          </div>

          <!-- ESTADO: formulário de nova senha -->
          <div id="estado-formulario" style="display:none;">
            <h1 style="font-size:1.5rem;font-weight:800;margin:0 0 20px;text-align:center;">Criar nova senha</h1>

            <div class="campo">
              <label for="senha-nova">Nova senha</label>
              <div style="position:relative;">
                <input id="senha-nova" type="password" placeholder="Pelo menos 8 caracteres" autocomplete="new-password" minlength="8" style="padding-right:44px;">
                <button type="button" class="botao-olho-senha" data-alvo="senha-nova" onclick="alternarVisibilidadeSenha(this)" aria-label="Mostrar senha" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;padding:8px;cursor:pointer;color:var(--texto-secundario);display:flex;align-items:center;">
                  <svg class="icone-olho-aberto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  <svg class="icone-olho-fechado" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.86 19.86 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a19.5 19.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </button>
              </div>
            </div>
            <div class="campo">
              <label for="senha-repetir">Repita a nova senha</label>
              <div style="position:relative;">
                <input id="senha-repetir" type="password" placeholder="Repita a senha" autocomplete="new-password" minlength="8" style="padding-right:44px;">
                <button type="button" class="botao-olho-senha" data-alvo="senha-repetir" onclick="alternarVisibilidadeSenha(this)" aria-label="Mostrar senha" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;padding:8px;cursor:pointer;color:var(--texto-secundario);display:flex;align-items:center;">
                  <svg class="icone-olho-aberto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  <svg class="icone-olho-fechado" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.86 19.86 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a19.5 19.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </button>
              </div>
            </div>

            <p id="erro-formulario" style="display:none;color:#ff6a6a;font-size:0.85rem;margin:-6px 0 14px;"></p>

            <button class="botao-primario largura-total" type="button" id="botao-salvar" onclick="salvarSenha()">
              Salvar nova senha
            </button>
          </div>

          <!-- ESTADO: sucesso -->
          <div id="estado-sucesso" style="display:none;text-align:center;">
            <h1 style="font-size:1.5rem;font-weight:800;margin:0 0 12px;">Senha alterada.</h1>
            <p style="color:var(--texto-secundario);margin:0;">Volte para o app e entre com a nova senha.</p>
          </div>

          <!-- ESTADO: link inválido/expirado -->
          <div id="estado-invalido" style="display:none;text-align:center;">
            <h1 style="font-size:1.5rem;font-weight:800;margin:0 0 12px;">Este link venceu.</h1>
            <p style="color:var(--texto-secundario);margin:0;">Peça um novo pelo app, em "Esqueci minha senha".</p>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; 2026 Fera Fit. Todos os direitos reservados.</span>
      <a href="privacidade.html">Privacidade</a>
    </div>
  </footer>

  <script>
    // Credenciais públicas do projeto Supabase (fera-fit-prod).
    // A chave "publishable" é feita para rodar no navegador — quem protege os dados é o RLS do banco.
    // Trocada de "anon" (formato antigo) para "publishable" (formato novo) em 2026-09-28, D034 do Orquestrador.
    // Fonte: Supabase → Settings → API Keys → Publishable key (IA de Backend e Infraestrutura, D070).
    var SUPABASE_URL = "https://jgzbxouzqtwfjapnfooj.supabase.co";
    var SUPABASE_PUBLISHABLE_KEY = "sb_publishable_vKEyW3okSfWu_RtxR-vbuw_Vl711Dy_";

    var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      // persistSession: false — a sessão só existe durante a troca de senha, não sobrevive depois.
      // Achado da Segurança (D010, 17/09/2026): sem isso, o token de recuperação ficava
      // gravado no localStorage do navegador mesmo depois da senha trocada.
      // flowType: "implicit" — corrigido na D039 (2026-09-29). O app pede o link com
      // signInWithOtp/emailRedirectTo, que usa o fluxo implícito (token vem no fragmento
      // #access_token=...). Estava "pkce" por engano, e a biblioteca do Supabase recusa
      // todo link (erro "Not a valid PKCE flow url") quando o formato não bate com o
      // flowType configurado aqui — não é o link que vencia, era a página que recusava.
      auth: { detectSessionInUrl: true, flowType: "implicit", persistSession: false }
    });

    var MIN_CARACTERES = 8;

    // Botão de olho para mostrar/esconder a senha digitada (pedido de Murilo, 2026-09-29).
    function alternarVisibilidadeSenha(botao) {
      var input = document.getElementById(botao.getAttribute("data-alvo"));
      var mostrando = input.type === "text";
      input.type = mostrando ? "password" : "text";
      botao.querySelector(".icone-olho-aberto").style.display = mostrando ? "block" : "none";
      botao.querySelector(".icone-olho-fechado").style.display = mostrando ? "none" : "block";
      botao.setAttribute("aria-label", mostrando ? "Mostrar senha" : "Esconder senha");
    }

    function mostrarEstado(id) {
      ["estado-carregando", "estado-formulario", "estado-sucesso", "estado-invalido"].forEach(function (e) {
        document.getElementById(e).style.display = (e === id) ? "block" : "none";
      });
    }

    async function verificarLink() {
      try {
        var resultado = await supabaseClient.auth.getSession();
        var session = resultado.data.session;
        // Limpa o fragmento (#access_token=...) do endereço assim que a sessão é lida —
        // nunca deixar o token na barra de endereço, no histórico ou em print (D039).
        // Seguro chamar mesmo se a biblioteca já limpou: replaceState não recarrega
        // a página e não cria uma nova entrada no histórico.
        if (window.location.hash) {
          window.history.replaceState(null, "", window.location.pathname);
        }
        if (session) {
          mostrarEstado("estado-formulario");
        } else {
          mostrarEstado("estado-invalido");
        }
      } catch (e) {
        if (window.location.hash) {
          window.history.replaceState(null, "", window.location.pathname);
        }
        mostrarEstado("estado-invalido");
      }
    }

    async function salvarSenha() {
      var nova = document.getElementById("senha-nova").value;
      var repetir = document.getElementById("senha-repetir").value;
      var erroEl = document.getElementById("erro-formulario");
      var botao = document.getElementById("botao-salvar");

      erroEl.style.display = "none";

      if (nova.length < MIN_CARACTERES) {
        erroEl.textContent = "A senha precisa de " + MIN_CARACTERES + " caracteres.";
        erroEl.style.display = "block";
        return;
      }
      if (nova !== repetir) {
        erroEl.textContent = "As senhas não coincidem.";
        erroEl.style.display = "block";
        return;
      }

      botao.disabled = true;
      botao.textContent = "Salvando...";

      try {
        var resultado = await supabaseClient.auth.updateUser({ password: nova });
        if (resultado.error) {
          var erro = resultado.error;
          // Acompanhamento da D039 (2026-09-29): registra o código/mensagem real do erro
          // no console (nunca o token) para dar pra diagnosticar sem depender de adivinhação
          // quando o motivo não é nenhum dos já tratados abaixo.
          console.error("criar-senha.html: updateUser retornou erro", { code: erro && erro.code, status: erro && erro.status, message: erro && erro.message });
          // Achado E15 (23/09/2026): quando o Supabase recusa a senha por ela já ter
          // aparecido em vazamentos conhecidos (checagem HaveIBeenPwned), mostra um aviso
          // específico em vez do erro genérico. Texto definido por Murilo.
          var senhaVazada = erro && erro.code === "weak_password" &&
            erro.weak_password && Array.isArray(erro.weak_password.reasons) &&
            erro.weak_password.reasons.indexOf("pwned") !== -1;
          // Achado D039-A (2026-09-29): o Supabase recusa a nova senha quando ela é igual
          // à senha atual da conta (código "same_password") — comum ao testar de novo com
          // a mesma senha de antes. Mensagem específica em vez do erro genérico.
          var senhaIgualAnterior = erro && erro.code === "same_password";
          erroEl.textContent = senhaVazada
            ? "Senha de fácil dedução, troque por uma senha mais segura."
            : senhaIgualAnterior
              ? "Essa já é sua senha atual. Escolha uma senha diferente da anterior."
              : "Não deu pra salvar agora. Tenta de novo em instantes.";
          erroEl.style.display = "block";
          botao.disabled = false;
          botao.textContent = "Salvar nova senha";
          // Encerra a sessão de recuperação mesmo quando a troca falha — ela não deve
          // sobrar válida no navegador se a pessoa desistir depois de um erro (D026, 23/09/2026).
          try { await supabaseClient.auth.signOut(); } catch (e2) {}
          return;
        }
        // Encerra a sessão de recuperação assim que a senha é trocada — ela não deve
        // continuar válida no navegador depois disso (D010, achado da Segurança, 17/09/2026).
        // A pessoa volta pro app e entra de novo com a senha nova, como o texto já orienta.
        await supabaseClient.auth.signOut();
        mostrarEstado("estado-sucesso");
      } catch (e) {
        console.error("criar-senha.html: updateUser lançou exceção", { code: e && e.code, status: e && e.status, message: e && e.message });
        erroEl.textContent = "Não deu pra salvar agora. Tenta de novo em instantes.";
        erroEl.style.display = "block";
        botao.disabled = false;
        botao.textContent = "Salvar nova senha";
        // Mesmo motivo do bloco acima: não deixar a sessão de recuperação sobrando
        // depois de uma falha inesperada (D026, 23/09/2026).
        try { await supabaseClient.auth.signOut(); } catch (e2) {}
      }
    }

    verificarLink();
  </script>
</body>
</html>
